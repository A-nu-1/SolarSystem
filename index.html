<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Solar System</title>
    <style>
        body {           
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            overflow: hidden;  
            isolation: isolate;
                          
        }
        body::before {
  content: "";
  position: fixed;
  inset: 0; 
  background: url("./stars.jpg") no-repeat center center fixed;
  background-size: cover;
  opacity: 0.5; /* Change this value between 0.0 and 1.0 */
  z-index: -1; /* Pushes the background behind everything */
}
        .container {
            font-size: 10px;
            width: 40em;
            height: 40em;
            position: relative;            
        }
        .sun {
            position: absolute;
            top: 15em;
            left: 15em;
            width: 10em;
            height: 10em;
            background-color: yellow;
            border-radius: 50%; 
            box-shadow: 0 0 3em white;

            animation: sunorbit 50s linear infinite;
        }
        .earth , .moon {
            position: absolute;
            border-style: solid;
            border-color: white transparent transparent transparent;
            border-width: 0.1em 0.1em 1em 0;
            border-radius: 50%;
        }
        .earth {
            top: 5em;
            left: 5em;
            width: 30em;
            height: 30em;
            animation: orbit 30s linear infinite;
        }
        .moon {
            top: 0;
            right: 0;
            width: 8em;
            height: 8em;
            animation: orbit 3s linear infinite;
        }
        .earth::before, .moon::before {
            content: '';
            display: block;
            position: absolute;
            border-radius: 50%;
        }
        .earth::before {
            top: 2.8em;
            right: 2.8em;
            width: 3em;
            height: 3em;
            background-color: aqua;
        }
        .moon::before {
            top: 0.8em;
            right: 0.2em;
            width: 1.2em;
            height: 1.2em;
            background-color: silver;
        }
        
        @keyframes orbit {          
            to {
                transform: rotate(360deg);
            }
        }
          @keyframes sunorbit {          
            to {
                transform: rotate(-360deg);
            }
        }
       .asuimage{
            position: absolute;
            top : 1em;
            left: 1em;
            height: 8em;
            border-radius: 50%;
            width: 8em;
            opacity: 88%;
        }
        .sunimg{
            height: 14.7em;
            width: 14.7em;
            top: -2.3em;
            left: -2.3em;
            position:absolute;
        }
        .earthimg{
            position: absolute;
            height: 3.6em;
            width: 3.6em;
            top:   2.47em;
            right: 2.47em;
        }
      
       
    </style>
</head>
<body>    
<div class="container">
    <div class="sun">
       <img class="sunimg" src="./sun.webp">
    </div>
    <div class="earth">
         <img class="earthimg" src="./earth.png">
        <div class="moon"></div>
    </div>
</div>
</body>
</html>
